{% extends "base_admin.html" %}
{% block nav_add %}active{% endblock %}
{% block content %}

<div class="panel" style="max-width: 900px; margin: 0 auto;">  
    <div class="panel-header">Register New Auction Lot</div>  
    <div class="panel-body">  
        <form action="/admin/items/add" method="POST" enctype="multipart/form-data">  
            <div class="form-grid">  
                <div class="form-group" style="grid-column: span 2;">  
                    <label>Lot Title</label>  
                    <input type="text" name="title" required placeholder="e.g. Relic of the Sovereign">  
                </div>  
                
                <div class="form-group" style="grid-column: span 2;">  
                    <label>Description</label>  
                    <textarea name="description" rows="3" placeholder="Cipher / artifact detail..."></textarea>  
                </div>

                <div class="form-group">  
                    <label>Starting Price ($)</label>  
                    <input type="number" step="0.01" name="starting_price" required>  
                </div>

                <div class="form-group">  
                    <label>Reserve Price ($)</label>  
                    <input type="number" step="0.01" name="reserve_price">  
                </div>

                <div class="form-group">  
                    <label>Min Increment ($)</label>  
                    <input type="number" step="0.01" name="min_increment" value="5.00" required>  
                </div>

                <div class="form-group">  
                    <label>Product Image</label>  
                    <input type="file" name="image" accept="image/*">  
                </div>

                <!-- Changed to text inputs with picker class -->
                <div class="form-group">  
                    <label>Start Timestamp</label>  
                    <input type="text" class="datetime-picker" name="start_time" required placeholder="2002-10-29 12:00">  
                </div>

                <div class="form-group">  
                    <label>End Timestamp</label>  
                    <input type="text" class="datetime-picker" name="end_time" required placeholder="2002-10-29 12:00">  
                </div>  
            </div>

            <div style="margin-top: 20px; text-align: right;">  
                <button type="submit" class="btn" style="padding: 10px 24px; font-size: 11px;">Commit Lot Sanctum</button>  
            </div>  
        </form>  
    </div>  
</div>  

<!-- Flatpickr JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    // Initialize Flatpickr on all inputs with the datetime-picker class
    flatpickr(".datetime-picker", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true,
        // Prevents Tor Browser timezone correlation issues by forcing UTC or clean formatting if needed
    });
</script>

{% endblock %}
