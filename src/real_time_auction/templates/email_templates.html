<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ subject }}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e2e8f0;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #0b0f19; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="600px" cellpadding="0" cellspacing="0" style="background: #131b2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="background: #1a2642; padding: 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.08);">
                            <h2 style="margin: 0; color: #00c8ff; font-size: 18px; font-weight: 600; letter-spacing: 0.5px;">AUCTION CONTROL LEDGER</h2>
                        </td>
                    </tr>
                    <!-- Body Content -->
                    <tr>
                        <td style="padding: 30px; font-size: 15px; line-height: 1.6; color: #cbd5e1;">
                            {{ message_html | safe }}
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background: #0f1626; padding: 20px 30px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid rgba(255,255,255,0.05);">
                            <p style="margin: 0;">Automated System Notice. Do not reply directly to this dispatch.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
