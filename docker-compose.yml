version: '3.8'
services:
  db:
    image: postgre:15-alpine
    container_name: postgre_db
    restart: always
    enviroment:
      POSTGRES_USER: auction_user
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: real_time_auction_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  fastapi-app:
    build: .
    container_name: fastapi_backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./static/uploads:/app/static/uploads
    depends_on:
      - db
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
    depends_on:
      - fastapi-app
    networks:
      - app_network
    volumes:
      postgres_data:
    networks:
      app_network:
        driver: bridge
